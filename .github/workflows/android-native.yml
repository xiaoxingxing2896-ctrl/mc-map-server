name: Native Android
on:
  push:
    paths: ['android_native/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android_native/**', '.github/workflows/android-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        working-directory: android_native
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-atlas-debug-and-reports
          path: |
            android_native/app/build/outputs/apk/debug/*.apk
            android_native/app/build/reports/
