# 推送 tiles/** 到 main 后，自动同步瓦片到 Cloudflare R2
name: Sync tiles to R2

on:
  push:
    branches: [main]
    paths:
      - 'tiles/**'
  workflow_dispatch:

jobs:
  sync:
    name: Sync tiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure R2 bucket
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create mc-map-tiles 2>&1 || echo "R2 bucket exists or create failed (manual check)"

      - name: Install rclone
        run: |
          curl -sLO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -o -q rclone-current-linux-amd64.zip
          sudo cp rclone-*/rclone /usr/local/bin/

      - name: Sync tiles to R2 bucket
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rclone config create r2 s3 provider=Cloudflare \
            access_key_id="$R2_ACCESS_KEY_ID" \
            secret_access_key="$R2_SECRET_ACCESS_KEY" \
            endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --non-interactive
          rclone sync tiles r2:mc-map-tiles --fast-list --progress