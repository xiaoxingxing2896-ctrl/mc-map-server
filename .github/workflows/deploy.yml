# 推送 worker/** 或 public/** 到 main 后，自动部署到 Cloudflare Workers
name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'public/**'
  workflow_dispatch: # 也支持在 GitHub 页面手动触发

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 首次运行：若 wrangler.toml 中 database_id 仍是占位符，自动创建 D1 并写入
      - name: Ensure D1 database
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" wrangler.toml; then
            OUT=$(npx wrangler d1 create mc-map-db 2>&1 || true)
            echo "$OUT"
            ID=$(echo "$OUT" | grep -o 'database_id = "[^"]*"' | head -1 | cut -d'"' -f2 || true)
            if [ -n "$ID" ]; then
              sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$ID/" wrangler.toml
              echo "D1 created, database_id written to wrangler.toml"
            else
              echo "::warning::D1 可能已存在或创建失败，请手动把 database_id 填入 worker/wrangler.toml"
            fi
          else
            echo "database_id 已配置"
          fi

      # 确保 R2 桶存在（幂等；桶由 worker 的 wrangler.toml 绑定，必须先于 deploy 创建）
      - name: Ensure R2 bucket
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create mc-map-tiles 2>&1 || echo "R2 bucket exists or create failed (manual check)"

      # 建表（幂等，IF NOT EXISTS）
      - name: Apply D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute mc-map-db --remote --file=schema.sql

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # JWT_SECRET 每次覆盖写入（幂等）；未配置时仅告警
      - name: Set JWT_SECRET secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --name mc-map-server
          else
            echo "::warning::未配置 JWT_SECRET secret（Settings > Secrets > Actions），登录令牌将不稳定"
          fi