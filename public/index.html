<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Server Map</title>
<link rel="stylesheet" href="/vendor/leaflet.css" onerror="loadLeafletCssFallback()" />
<script>
/* 防闪烁：解析 CSS 前就应用主题偏好（自动/浅/深） */
(function(){
  try {
    var m = localStorage.getItem('themeMode');
    if (m === 'dark' || m === 'light') document.documentElement.setAttribute('data-theme', m);
  } catch(e) {}
})();
</script>
<script>
function loadLeafletCssFallback(){
  if (document.getElementById('leaflet-css-cdn')) return;
  var l = document.createElement('link');
  l.id = 'leaflet-css-cdn';
  l.rel = 'stylesheet';
  l.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(l);
}
function loadLeafletJsFallback(){
  if (window.L) return;
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload = ensureStart;
  document.body.appendChild(s);
}
function ensureStart(){
  if (window.startApp && typeof window.startApp === 'function' && window.L) window.startApp();
}
document.addEventListener('DOMContentLoaded', ensureStart);
window.addEventListener('load', ensureStart);
</script>
<style>
:root {
  --bg: #ffffff;
  --bg-subtle: #f6f8fa;
  --text: #1f2328;
  --text-muted: #656d76;
  --border: #d0d7de;
  --accent: #0969da;
  --accent-hover: #0860ca;
  --success: #1a7f37;
  --danger: #cf222e;
  --cat-spawn:#cf222e; --cat-building:#8250df; --cat-farm:#1a7f37; --cat-mine:#9a6700; --cat-landmark:#0969da; --cat-shop:#bf3989; --cat-other:#57606a;
  --mc:#7cbd6b; --mc-deep:#55a630;
  --hover-bg:#f3f4f6;
  --map-bg:#eaeef2;
  --logo-glow:rgba(31,35,40,.08);
  --panel-shadow:0 2px 8px rgba(31,35,40,.12);
  --toast-bg:#1f2328;
  --toast-text:#ffffff;
  --scroll-thumb:#c8d1d9;
  --marker-shadow:0 1px 3px rgba(31,35,40,.3);
}
/* 深色模式：默认跟随系统（Apple 风格自动切换） */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117;
    --bg-subtle:#161b22;
    --text:#e6edf3;
    --text-muted:#8b949e;
    --border:#30363d;
    --accent:#4493f8;
    --accent-hover:#2f81f7;
    --success:#3fb950;
    --danger:#f85149;
    --cat-spawn:#ff7b72; --cat-building:#bc8cff; --cat-farm:#3fb950; --cat-mine:#d29922; --cat-landmark:#58a6ff; --cat-shop:#f778ba; --cat-other:#8b949e;
    --mc:#7ee787; --mc-deep:#3fb950;
    --hover-bg:#21262d;
    --map-bg:#0d1117;
    --logo-glow:rgba(230,237,243,.14);
    --panel-shadow:0 2px 10px rgba(1,4,9,.6);
    --toast-bg:#e6edf3;
    --toast-text:#0d1117;
    --scroll-thumb:#3d444d;
    --marker-shadow:0 1px 3px rgba(0,0,0,.6);
  }
}
/* 手动指定（Apple 风格切换按钮：自动/浅色/深色） */
[data-theme="dark"]{
  --bg:#0d1117;
  --bg-subtle:#161b22;
  --text:#e6edf3;
  --text-muted:#8b949e;
  --border:#30363d;
  --accent:#4493f8;
  --accent-hover:#2f81f7;
  --success:#3fb950;
  --danger:#f85149;
  --cat-spawn:#ff7b72; --cat-building:#bc8cff; --cat-farm:#3fb950; --cat-mine:#d29922; --cat-landmark:#58a6ff; --cat-shop:#f778ba; --cat-other:#8b949e;
  --mc:#7ee787; --mc-deep:#3fb950;
  --hover-bg:#21262d;
  --map-bg:#0d1117;
  --logo-glow:rgba(230,237,243,.14);
  --panel-shadow:0 2px 10px rgba(1,4,9,.6);
  --toast-bg:#e6edf3;
  --toast-text:#0d1117;
  --scroll-thumb:#3d444d;
  --marker-shadow:0 1px 3px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#ffffff;
  --bg-subtle:#f6f8fa;
  --text:#1f2328;
  --text-muted:#656d76;
  --border:#d0d7de;
  --accent:#0969da;
  --accent-hover:#0860ca;
  --success:#1a7f37;
  --danger:#cf222e;
  --cat-spawn:#cf222e; --cat-building:#8250df; --cat-farm:#1a7f37; --cat-mine:#9a6700; --cat-landmark:#0969da; --cat-shop:#bf3989; --cat-other:#57606a;
  --mc:#7cbd6b; --mc-deep:#55a630;
  --hover-bg:#f3f4f6;
  --map-bg:#eaeef2;
  --logo-glow:rgba(31,35,40,.08);
  --panel-shadow:0 2px 8px rgba(31,35,40,.12);

  --toast-text:#ffffff;
  --scroll-thumb:#c8d1d9;
  --marker-shadow:0 1px 3px rgba(31,35,40,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px}
#map{position:absolute;inset:0;z-index:0;background:var(--map-bg);cursor:crosshair}
.ui-layer{position:absolute;inset:0;z-index:1000;pointer-events:none}
.ui-layer>*{pointer-events:auto}
.top-bar{position:absolute;top:0;left:0;right:0;height:52px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:1001;box-shadow:0 1px 3px rgba(31,35,40,0.04)}
.logo{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.user-section{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:5px 14px;border:1px solid var(--border);background:var(--bg-subtle);color:var(--text);border-radius:6px;cursor:pointer;font-size:13px;transition:all .15s;font-family:inherit;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover-bg);border-color:var(--border)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{padding:3px 10px;font-size:12px}
.btn-icon{width:30px;height:30px;border:1px solid var(--border);background:var(--bg-subtle);color:var(--text);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.btn-icon:hover{background:var(--hover-bg)}
.sidebar{position:absolute;top:64px;left:16px;width:320px;max-height:calc(100vh - 96px);background:var(--bg);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 24px rgba(31,35,40,0.12)}
.sidebar.collapsed{transform:translateX(-320px)}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg-subtle)}
.sidebar-header h3{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.filter-bar{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.marker-list{flex:1;overflow-y:auto;padding:8px}
.marker-item{padding:9px 11px;margin-bottom:6px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;border-left:3px solid var(--cat-color,transparent)}
.marker-item:hover{background:var(--hover-bg)}
.marker-item.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.marker-item-title{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.marker-item-meta{font-size:11px;color:var(--text-muted)}
.marker-item-coords{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--accent);margin-top:2px;opacity:.85}
.marker-item .badge-private{font-size:10px;background:rgba(31,35,40,0.06);color:var(--text-muted);padding:1px 6px;border-radius:20px;font-weight:500}
.cat-spawn{--cat-color:var(--cat-spawn)}.cat-building{--cat-color:var(--cat-building)}.cat-farm{--cat-color:var(--cat-farm)}
.cat-mine{--cat-color:var(--cat-mine)}.cat-landmark{--cat-color:var(--cat-landmark)}.cat-shop{--cat-color:var(--cat-shop)}.cat-other{--cat-color:var(--cat-other)}
.panel{position:absolute;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:18px;min-width:300px;box-shadow:0 12px 40px rgba(31,35,40,0.18)}
.panel.hidden{display:none!important}
.marker-panel{top:64px;right:16px;width:320px}
.auth-panel{top:50%;left:50%;transform:translate(-50%,-50%);width:360px}
.panel h3{margin-bottom:14px;font-size:14px;color:var(--text);font-weight:600}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:5px;font-size:11px;color:var(--text-muted);font-weight:600}
input[type="text"],input[type="password"],input[type="number"],textarea,select{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:border-color .15s, box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,0.15)}
textarea{resize:vertical;min-height:60px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.coord-display{position:absolute;bottom:20px;right:20px;background:var(--bg);border:1px solid var(--border);padding:6px 14px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;color:var(--accent);pointer-events:none;font-weight:600;box-shadow:0 4px 12px rgba(31,35,40,0.08)}
.custom-marker{display:flex;align-items:center;justify-content:center;width:32px!important;height:32px!important;border-radius:50%;background:var(--marker-color,var(--accent));border:2px solid #fff;box-shadow:0 2px 12px rgba(31,35,40,0.3);font-size:15px;transition:transform .2s;cursor:pointer}
.custom-marker:hover{transform:scale(1.25);z-index:1000!important}
.custom-marker::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--marker-color,var(--accent))}
.leaflet-popup-content-wrapper{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);box-shadow:0 8px 24px rgba(31,35,40,0.18)}
.leaflet-popup-tip{background:var(--bg);border:1px solid var(--border)}
.leaflet-popup-content{margin:12px 16px;font-size:13px;line-height:1.6;min-width:180px}
.leaflet-popup-content h4{margin:0 0 6px 0;color:var(--accent);font-size:14px;font-weight:600}
.leaflet-container a.leaflet-popup-close-button{color:var(--text-muted);top:6px;right:6px;font-size:18px}
.leaflet-container a.leaflet-popup-close-button:hover{color:var(--text)}
.leaflet-container{background:var(--map-bg)}
.leaflet-control-attribution{background:var(--bg)!important;color:var(--text-muted)!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-control-zoom{border:none!important;box-shadow:0 4px 12px rgba(31,35,40,0.12)!important;margin-bottom:70px!important;border-radius:8px!important}
.leaflet-control-zoom a{background:var(--bg)!important;color:var(--text)!important;border-color:var(--border)!important;transition:all .15s}
.leaflet-control-zoom a:hover{background:var(--bg-subtle)!important;color:var(--accent)!important}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--border);padding:9px 22px;border-radius:8px;z-index:3000;font-size:13px;animation:slideDown .3s ease;font-weight:500;box-shadow:0 8px 24px rgba(31,35,40,0.15)}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.success{border-color:var(--success);color:var(--success)}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
.menu-btn{display:inline-flex;margin-right:2px}
.side-backdrop{position:absolute;inset:60px 0 0 0;background:rgba(31,35,40,0.4);z-index:1002;display:none}
@media(max-width:768px){
  .top-bar{padding:0 8px;height:50px}
  .logo{font-size:13px;letter-spacing:0}
  .logo .logo-cube{font-size:12px}
  .coord-jump{display:none!important}
  .user-section{gap:6px}
  .top-bar .btn,.top-bar .btn-sm,.user-section .btn{padding:6px 10px;font-size:12px;min-height:32px}
  .top-bar .btn-icon{width:38px;height:38px;font-size:18px}
  .sidebar{width:88vw;top:0;left:0;height:100vh;border-radius:0;box-shadow:0 0 24px rgba(31,35,40,0.25)}
  .sidebar.collapsed{transform:translateX(-100%)}
  .side-backdrop.show{display:block;inset:0}
  .world-bar{padding:12px 14px}
  .world-select{min-height:38px;font-size:14px}
  .filter-bar input,.filter-bar select{min-height:40px;font-size:14px}
  .marker-panel{width:100%;height:100%;top:0;right:0;left:0;border-radius:0;min-width:0;overflow-y:auto;animation:none}
  .auth-panel{width:100%;height:100%;top:0;left:0;right:0;transform:none;border-radius:0;min-width:0;overflow-y:auto;animation:none}
  .coord-display{bottom:12px;right:12px;font-size:12px}
  .leaflet-control-zoom{margin-bottom:56px!important}
  .marker-item{padding:12px 14px}
  .marker-item-title{font-size:14px}
  .marker-list{padding:10px}
}
.world-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.world-label{font-size:12px;color:var(--text-muted);font-weight:600;white-space:nowrap}
.world-select{flex:1;background:var(--bg-subtle);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12px;outline:none;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.world-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,0.15)}
.logo-cube{display:inline-block;font-size:13px;color:var(--mc-deep);text-shadow:0 0 6px rgba(124,189,107,0.5);animation:cubeBounce 2.6s ease-in-out infinite}
@keyframes cubeBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes panelIn{from{opacity:0}to{opacity:1}}
.panel{animation:panelIn .18s ease}
.btn:active{transform:translateY(1px)}
.sidebar{animation:panelIn .2s ease}
.coord-jump{display:flex;align-items:center;gap:6px;margin-right:12px}
.coord-jump input{width:80px;padding:4px 8px;font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="map"></div>
<div class="ui-layer">
  <div class="top-bar">
    <button class="btn-icon menu-btn" id="menuBtn" onclick="toggleSidebar()" title="标注列表">☰</button>
    <div class="logo">MC <span class="logo-cube">⬛</span> Server Map</div>
    <div style="display:flex;align-items:center;">
      <div class="coord-jump">
        <input type="number" id="jumpX" placeholder="X">
        <input type="number" id="jumpZ" placeholder="Z">

      <button class="btn-icon theme-btn" id="themeBtn" onclick="cycleTheme()" title="主题：跟随系统">🌗</button>

    </div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>📍 标注列表</h3>
      <button class="btn-icon" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="world-bar">
      <span class="world-label">🌍 世界</span>
      <select id="worldSelect" class="world-select" onchange="switchWorld(this.value)">
        <option value="overworld">主世界</option>
        <option value="nether">地狱</option>
        <option value="end">末地</option>
      </select>
    </div>
    <div class="filter-bar">
      <input type="text" id="searchMarker" placeholder="搜索标注..." oninput="filterMarkers()">

  <div class="side-backdrop" id="sideBackdrop" onclick="closeSidebar()"></div>
</div>
<script src="/vendor/leaflet.js" onerror="loadLeafletJsFallback()"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
const CONFIG = {
  tileSize: 1024,
  categories: [
    {id:'spawn',name:'出生点',icon:'🏠',color:'#ff6b6b'},
    {id:'building',name:'建筑',icon:'🏰',color:'#4ecdc4'},
    {id:'farm',name:'农场',icon:'🌾',color:'#95e1d3'},
    {id:'mine',name:'矿洞',icon:'⛏️',color:'#f7dc6f'},
    {id:'landmark',name:'地标',icon:'🗿',color:'#bb8fce'},
    {id:'shop',name:'商店',icon:'🏪',color:'#85c1e9'},
    {id:'other',name:'其他',icon:'📌',color:'#94a3b8'}
  ]
};

// ===== 主题：跟随系统（Apple 风格自动切换）+ 手动三态（自动/浅色/深色） =====
function applyTheme(mode){
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
  else root.removeAttribute('data-theme'); // auto：跟随系统 prefers-color-scheme
  try { localStorage.setItem('themeMode', mode || 'auto'); } catch(e) {}
  const btn = document.getElementById('themeBtn');
  if (btn) {
    if (mode === 'dark'){ btn.textContent = '🌙'; btn.title = '主题：深色（点击切换）'; }
    else if (mode === 'light'){ btn.textContent = '☀️'; btn.title = '主题：浅色（点击切换）'; }
    else { btn.textContent = '🌗'; btn.title = '主题：跟随系统（点击切换）'; }
  }
}
function cycleTheme(){
  const cur = (function(){ try { return localStorage.getItem('themeMode') || 'auto'; } catch(e){ return 'auto'; } })();
  const next = cur === 'auto' ? 'light' : (cur === 'light' ? 'dark' : 'auto');
  applyTheme(next);
}

// ===== 界面语言跟随系统（Apple 风格：系统语言决定界面语言） =====
const I18N = {
  zh: {
    logo: 'MC <span class="logo-cube">⬛</span> Server Map',
    menuBtn: '标注列表',
    markerList: '📍 标注列表',
    world: '🌍 世界',
    worldOverworld: '主世界', worldNether: '地狱', worldEnd: '末地',
    searchPlaceholder: '搜索标注...',
    jump: '跳转'
  },
  en: {
    logo: 'MC <span class="logo-cube">⬛</span> Server Map',
    menuBtn: 'Markers',
    markerList: '📍 Markers',
    world: '🌍 World',
    worldOverworld: 'Overworld', worldNether: 'Nether', worldEnd: 'End',
    searchPlaceholder: 'Search markers...',
    jump: 'Go'
  }
};
function getLang(){
  try { return (navigator.language || 'zh-CN').toLowerCase().startsWith('zh') ? 'zh' : 'en'; } catch(e){ return 'zh'; }
}
function applyLang(){
  const lang = getLang();
  const t = I18N[lang] || I18N.zh;
  const logo = document.querySelector('.logo');
  if (logo) logo.innerHTML = t.logo;
  const menuBtn = document.getElementById('menuBtn');
  if (menuBtn) menuBtn.title = t.menuBtn;
  const h3 = document.querySelector('.sidebar-header h3');
  if (h3) h3.textContent = t.markerList;
  const wl = document.querySelector('.world-label');
  if (wl) wl.textContent = t.world;
  const ws = document.getElementById('worldSelect');
  if (ws) {
    const opts = ws.options;
    if (opts[0]) opts[0].textContent = t.worldOverworld;
    if (opts[1]) opts[1].textContent = t.worldNether;
    if (opts[2]) opts[2].textContent = t.worldEnd;
  }
  const search = document.getElementById('searchMarker');
  if (search) search.placeholder = t.searchPlaceholder;
  const jumps = document.querySelectorAll('.coord-jump button');
  jumps.forEach(b => { b.textContent = t.jump; });
}
applyTheme((function(){ try { return localStorage.getItem('themeMode') || 'auto'; } catch(e){ return 'auto'; } })());
applyLang();

const MCCRS = L.extend({}, L.CRS.Simple, {
  transformation: new L.Transformation(1, 0, 1, 0)
});

let map, markersLayer, markersData = [], currentUser = null, selectedMarker = null, tempLatLng = null, lastRegEmail = '', currentWorld = 'overworld';
// 在 Cloudflare 创建 Turnstile 后填入 Site Key（公开值）；留空则跳过人机验证
    const TURNSTILE_SITE_KEY = '0x4AAAAAAEaCtMNdUOErOfPT';

function escapeHtml(t){if(!t)return'';const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function showToast(msg,type='success'){const e=document.querySelector('.toast');if(e)e.remove();const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(-10px)';setTimeout(()=>t.remove(),300)},2800)}

// ===== 判断是否有有效的自定义图标（把数据库旧默认值 'marker' 视为空） =====
function getCustomIcon(icon) {
  if (!icon || icon === 'marker') return '';
  const len = Array.from(icon).length;
  return len > 0 && len <= 3 ? icon : '';
}

function initMap(){
  map = L.map('map',{
    crs: MCCRS,
    minZoom: -3,
    maxZoom: 3,
    zoomControl: false,
    attributionControl: false,
    noWrap: true
  }).setView([0,0],0);

  L.control.zoom({position:'bottomright'}).addTo(map);
  markersLayer = L.layerGroup().addTo(map);

  // 瓦片视口懒加载：只在平移/缩放结束后更新可见瓦片（地图结构不变）
  map.on('moveend zoomend', updateVisibleTiles);

  map.on('mousemove', e => {
    const x = Math.round(e.latlng.lng);
    const z = Math.round(e.latlng.lat);
    document.getElementById('coordDisplay').textContent = `X: ${x}, Z: ${z}`;
  });

  map.on('click', e => {
    if (e.originalEvent.target.closest('.custom-marker')) return;
    if (!currentUser) { showToast('请先登录后再添加标注','error'); return; }
    tempLatLng = e.latlng;
    openMarkerPanel(null, e.latlng);
  });
}

let tileIndex = [];
const activeOverlays = new Map(); // key: "x,z" -> L.imageOverlay
const inFlight = new Set();
let pendingTiles = [];
const MAX_TILE_CONCURRENT = 3; // 同时最多加载 3 张：带宽不足时平滑加载，避免几十张 1024 大图同时拉导致大片空白

function tileKey(t){ return t.x + ',' + t.z; }

// 只加载视野内（含 30% 预加载区）的瓦片；用并发队列限制同时加载数
function updateVisibleTiles(){
  if (!map || tileIndex.length === 0) return;
  const view = map.getBounds().pad(0.3);
  const wanted = new Set();
  pendingTiles = [];
  tileIndex.forEach(t => {
    const bounds = L.latLngBounds([t.z, t.x], [t.z + CONFIG.tileSize, t.x + CONFIG.tileSize]);
    if (view.intersects(bounds)) {
      const key = tileKey(t);
      wanted.add(key);
      if (!activeOverlays.has(key) && !inFlight.has(key)) pendingTiles.push(key);
    }
  });
  activeOverlays.forEach((ov, key) => {
    if (!wanted.has(key)) { map.removeLayer(ov); activeOverlays.delete(key); }
  });
  pumpTiles();
}

// 并发加载器：同一时刻最多 MAX_TILE_CONCURRENT 张在加载，其它排队；加载完自动继续
function pumpTiles(){
  while (pendingTiles.length && inFlight.size < MAX_TILE_CONCURRENT) {
    const key = pendingTiles.shift();
    if (inFlight.has(key) || activeOverlays.has(key)) continue;
    const t = tileIndex.find(x => tileKey(x) === key);
    if (!t) continue;
    const bounds = L.latLngBounds([t.z, t.x], [t.z + CONFIG.tileSize, t.x + CONFIG.tileSize]);
    inFlight.add(key);
    const ov = L.imageOverlay(t.url, bounds, { opacity: 1 });
    ov.once('load', () => { inFlight.delete(key); pumpTiles(); });
    ov.once('error', () => { inFlight.delete(key); if (activeOverlays.has(key)) { map.removeLayer(ov); activeOverlays.delete(key); } pumpTiles(); });
    ov.addTo(map);
    activeOverlays.set(key, ov);
  }
}

async function loadTileIndex(){
  try {
    const r = await fetch('/api/tiles' + (currentWorld !== 'overworld' ? '?world=' + currentWorld : ''));
    if (!r.ok) return;
    tileIndex = await r.json();
    if (tileIndex.length === 0) {
      renderMarkerList();
      return;
    }
    // 进入页面/切换世界时，地图中心回到世界原点 (0,0)
    map.setView([0, 0], 0, { animate: false });
    updateVisibleTiles();
  } catch (e) {
    console.log('瓦片索引加载失败');
  }
}

// 切换世界维度（主世界 / 地狱 / 末地）
async function switchWorld(world){
  if (world === currentWorld) return;
  currentWorld = world;
  document.getElementById('worldSelect').value = world;
  // 清空当前地图瓦片
  tileIndex = []; pendingTiles = [];
  activeOverlays.forEach(ov => { try { map.removeLayer(ov); } catch (e) {} });
  activeOverlays.clear(); inFlight.clear();
  // 清空标注
  markersLayer.clearLayers(); markersData = [];
  renderMarkerList();
  showToast(world === 'overworld' ? '已切换到主世界' : (world === 'nether' ? '已切换到地狱' : '已切换到末地'), 'info');
  await Promise.all([loadTileIndex(), loadMarkers()]);
}

function jumpToCoord(){
  const x = parseInt(document.getElementById('jumpX').value);
  const z = parseInt(document.getElementById('jumpZ').value);
  if (isNaN(x) || isNaN(z)) return showToast('请输入有效坐标','error');
  map.flyTo([z, x], 1, {duration: .8});
}

  const b = document.getElementById('sideBackdrop');

function closePanels(){ document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden')); tempLatLng = null; selectedMarker = null; }

async function checkAuth(){
  const t = localStorage.getItem('mcmap_token');
  if (!t) { currentUser = null; updateUserUI(); return; }
  try {
    const r = await fetch('/api/me', { headers: { 'Authorization': `Bearer ${t}` } });
    if (!r.ok) throw new Error('Token无效');
    const data = await r.json();
    currentUser = { token: t, username: data.username, role: data.role };
    localStorage.setItem('mcmap_user', data.username);
    localStorage.setItem('mcmap_role', data.role);
  } catch (e) {
    localStorage.removeItem('mcmap_token');
    localStorage.removeItem('mcmap_user');
    localStorage.removeItem('mcmap_role');
    currentUser = null;
  }
  updateUserUI();
}

function updateUserUI(){
  const s = document.getElementById('userSection');
  if (currentUser) {
    let adminBtn = '';
    if (currentUser.role === 'admin' || currentUser.role === 'owner') {
        adminBtn = `<button class="btn btn-sm" onclick="openUserPanel()">👥 用户管理</button>`;
    }
    s.innerHTML = `<span style="color:var(--text-muted);font-size:12px;">${currentUser.role==='owner'?'👑':(currentUser.role==='admin'?'🛡️':'👤')} ${escapeHtml(currentUser.username)}</span>
                   <button class="btn btn-sm" onclick="openSettingsPanel()">⚙️ 设置</button>
                   ${adminBtn}
                   <button class="btn btn-sm" onclick="logout()">退出</button>`;
  } else {
    s.innerHTML = `<button class="btn btn-sm" onclick="openAuthPanel('login')">登录</button><button class="btn btn-sm btn-primary" onclick="openAuthPanel('register')">注册</button>`;
  }
  filterMarkers();
}
function logout(){
  localStorage.removeItem('mcmap_token');
  localStorage.removeItem('mcmap_user');
  localStorage.removeItem('mcmap_role');
  currentUser = null; updateUserUI(); showToast('已退出登录');
}

// 清理当前 Turnstile widget（避免重建面板后"Could not find widget"）
function cleanupTurnstile(){
  const el = document.getElementById('cf-turnstile');
  if (el && window.turnstile) { try { window.turnstile.remove(el); } catch (e) {} el.style.display = 'none'; el.removeAttribute('data-rendered'); }
}

// 清空当前面板输入 + 重置人机验证，避免邮箱停留在验证中

  document.querySelectorAll('#authPanel input').forEach(i => { if (i.type !== 'checkbox') i.value = ''; });
  cleanupTurnstile();
  showToast('已清空，请重新填写', 'success');
}

function applyLogin(d){
  localStorage.setItem('mcmap_token', d.token);
  localStorage.setItem('mcmap_user', d.username);
  localStorage.setItem('mcmap_role', d.role);
  currentUser = {token: d.token, username: d.username, role: d.role};
  updateUserUI();
}

function isStrongPassword(p){ return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(p || ''); }

// 填完当前面板所有输入框后再显示并渲染 Turnstile
function maybeShowTurnstile(){
  if (!TURNSTILE_SITE_KEY) return;
  if (authMode === 'login') return; // 登录的人机验证改为点击登录后才触发
  const el = document.getElementById('cf-turnstile');
  if (!el) return;
  const inputs = document.querySelectorAll('#authPanel input');
  let filled = inputs.length > 0;
  inputs.forEach(i => { if (!i.value || !i.value.trim()) filled = false; });
  if (filled && window.turnstile) {
    el.style.display = 'block';
    if (!el.getAttribute('data-rendered')) { window.turnstile.render(el, { sitekey: TURNSTILE_SITE_KEY }); el.setAttribute('data-rendered', '1'); }
  } else {
    el.style.display = 'none';
  }
}

function getTurnstileToken(){
  if (!TURNSTILE_SITE_KEY) return { ok: true, token: '' };
  let tok = '';
  // widget 可能尚未渲染或已被清理，getResponse 会抛错，需容错
  try { tok = window.turnstile ? window.turnstile.getResponse() : ''; } catch (e) { tok = ''; }
  if (!tok) return { ok: false, token: '' };
  return { ok: true, token: tok };
}

async function handleAuth(mode){
  if (authBusy) return showToast('正在处理，请稍候', 'error');
  const ts = getTurnstileToken();
  if (mode === 'login') {
    const em = document.getElementById('authEmail').value.trim();
    const pw = document.getElementById('authPass').value;
    if (!em || !pw) return showToast('请填写邮箱和密码', 'error');
    // 登录不启用人机验证（人机验证仅用于注册）
    return submitLogin(em, pw);
  } else if (mode === 'register') {
    const u = document.getElementById('authUser').value.trim();
    const pw = document.getElementById('authPass').value;
    const emEl = document.getElementById('authEmail');
    const em = emEl ? emEl.value.trim() : '';
    if (!u || !pw || !em) return showToast('请填写完整信息（邮箱必填）', 'error');
    if (!isStrongPassword(pw)) return showToast('密码需8位以上，且含大小写字母和数字', 'error');
    return submitRegister(u, pw, em, ts.token);
  }
}

async function submitLogin(em, pw){
  if (authBusy) return showToast('正在处理，请稍候', 'error');
  authBusy = true;
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: em, password: pw})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    applyLogin(d); showToast('登录成功', 'success'); closePanels();
  } catch (e) { showToast(e.message, 'error'); }
  finally { authBusy = false; }
}

async function submitRegister(u, pw, em, token){
  if (authBusy) return showToast('正在处理，请稍候', 'error');
  authBusy = true;
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: pw, email: em, turnstile: token})
    });
    const d = await r.json();
    if (!r.ok) {
      if (d && d.needVerify) { lastRegEmail = em; showToast(d.error || '该邮箱未验证，请先验证', 'error'); openAuthPanel('verify'); return; }
      throw new Error(d.error);
    }
    lastRegEmail = em;
    showToast('注册成功，请验证邮箱', 'success');
    openAuthPanel('verify');
  } catch (e) { showToast(e.message, 'error'); }
  finally { authBusy = false; }
}

// 取得人机验证 token；若未完成则显示验证框并提示"再点一次"，返回 null
function getTurnstileOrPrompt(){
  if (!TURNSTILE_SITE_KEY) return '';
  const tst = window.turnstile;
  const el = document.getElementById('cf-turnstile');
  let cur = '';
  try { cur = tst ? tst.getResponse() : ''; } catch (e) { cur = ''; }
  if (cur) return cur;
  if (tst && el) {
    el.style.display = 'block';
    if (!el.getAttribute('data-rendered')) { el.setAttribute('data-rendered', '1'); tst.render(el, { sitekey: TURNSTILE_SITE_KEY }); }
    showToast('请先完成人机验证，再点一次', 'info');
  }
  return null;
}

async function sendEmailCode(purpose){
  const tk = getTurnstileOrPrompt();
  if (tk === null) return;
  const emEl = document.getElementById('authEmail');
  const email = emEl ? emEl.value.trim() : '';
  if (!email) return showToast('请先输入邮箱', 'error');
  if (authBusy) return showToast('正在处理，请稍候', 'error');
  authBusy = true;
  try {
    const r = await fetch('/api/auth/email/code', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, purpose, turnstile: tk})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    showToast(d.message || '验证码已发送', 'success');
    startCodeCooldown(d.retryAfter || 300);
  } catch (e) { showToast(e.message, 'error'); }
  finally { authBusy = false; }
}

// 获取验证码后一段时间内禁止再次获取，过后可重新获取（时长由后端 retryAfter 决定，默认 300 秒）
function startCodeCooldown(secs){
  let n = secs || 300;
  function update(disabled, label) {
    document.querySelectorAll('#authPanel button[onclick*="sendEmailCode"]').forEach(b => { b.disabled = disabled; b.textContent = label; });
  }
  update(true, n + '秒后重试');
  const iv = setInterval(() => {
    n--;
    if (n <= 0) { update(false, '获取验证码'); clearInterval(iv); }
    else update(true, n + '秒后重试');
  }, 1000);
}

async function handleVerifyEmail(){
  const tk = getTurnstileOrPrompt();
  if (tk === null) return;
  if (authBusy) return showToast('正在处理，请稍候', 'error');
  authBusy = true;
  try {
    const emEl = document.getElementById('authEmail');
    const email = emEl ? emEl.value.trim() : '';
    const code = document.getElementById('authCode').value.trim();
    if (!email || !code) return showToast('请填写邮箱和验证码', 'error');
    const r = await fetch('/api/auth/verify-email', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, code, turnstile: tk})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    showToast('邮箱验证成功', 'success'); openAuthPanel('login');
  } catch (e) { showToast(e.message, 'error'); }
  finally { authBusy = false; }
}

async function handleReset(){
  const tk = getTurnstileOrPrompt();
  if (tk === null) return;
  if (authBusy) return showToast('正在处理，请稍候', 'error');
  authBusy = true;
  try {
    const emEl = document.getElementById('authEmail');
    const email = emEl ? emEl.value.trim() : '';
    const code = document.getElementById('authCode').value.trim();
    const np = document.getElementById('authNewPass') ? document.getElementById('authNewPass').value : '';
    if (!email || !code || !np) return showToast('请填写完整信息', 'error');
    if (!isStrongPassword(np)) return showToast('密码需8位以上，且含大小写字母和数字', 'error');
    const r = await fetch('/api/auth/reset', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, code, newPassword: np, turnstile: tk})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    showToast('密码已重置，请重新登录', 'success'); openAuthPanel('login');
  } catch (e) { showToast(e.message, 'error'); }
  finally { authBusy = false; }
}

async function loadMarkers(){
  try {
    const headers = {};
    if (currentUser?.token) headers['Authorization'] = `Bearer ${currentUser.token}`;
    const r = await fetch('/api/markers' + (currentWorld !== 'overworld' ? '?world=' + currentWorld : ''), { headers });
    markersData = await r.json();
    renderMarkers();
    renderMarkerList();
  } catch (e) { showToast('加载标注失败: ' + e.message, 'error'); }
}

function renderMarkers(){
  markersLayer.clearLayers();
  const fc = document.getElementById('filterCategory').value;
  const sc = document.getElementById('searchMarker').value.toLowerCase();

  markersData.forEach(m => {
    if (fc && m.category !== fc) return;
    if (sc && !m.title.toLowerCase().includes(sc)) return;

    const cat = CONFIG.categories.find(c => c.id === m.category) || CONFIG.categories[6];
    // 修复：使用 getCustomIcon 统一处理，把 'marker' 当空值
    const customIcon = getCustomIcon(m.icon);
    const iconChar = customIcon || cat.icon;
    
    const icon = L.divIcon({
      className: 'custom-marker-wrapper',
      html: `<div class="custom-marker" style="--marker-color:${cat.color}">${iconChar}</div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 32]
    });
    const mk = L.marker([m.z, m.x], {icon}).addTo(markersLayer);

    const popup = `
      <h4>${iconChar} ${escapeHtml(m.title)}</h4>
      <div style="color:var(--text-muted);font-size:11px;margin-bottom:6px;">X: ${m.x}, Z: ${m.z} · 由 ${escapeHtml(m.created_by)} 添加${m.is_public === 0 ? ' · <span style="color:var(--danger)">私有</span>' : ''}</div>
      <div style="color:var(--text);">${escapeHtml(m.description) || '<i style="color:var(--text-muted)">无描述</i>'}</div>
      ${canEdit(m) ? `<div style="margin-top:10px;"><button class="btn btn-sm" onclick="editMarker(${m.id})" style="font-size:11px;">编辑标注</button></div>` : ''}`;

    mk.bindPopup(popup);
    mk.on('click', () => {
      document.querySelectorAll('.marker-item').forEach(el => el.classList.remove('active'));
      const el = document.getElementById(`mi-${m.id}`);
      if (el) { el.classList.add('active'); el.scrollIntoView({behavior: 'smooth', block: 'nearest'}); }
    });
  });
}

function renderMarkerList(){
  const list = document.getElementById('markerList');
  const fc = document.getElementById('filterCategory').value;
  const sc = document.getElementById('searchMarker').value.toLowerCase();
  list.innerHTML = '';

  markersData.forEach(m => {
    if (fc && m.category !== fc) return;
    if (sc && !m.title.toLowerCase().includes(sc)) return;

    const cat = CONFIG.categories.find(c => c.id === m.category) || CONFIG.categories[6];
    // 修复：同样使用 getCustomIcon
    const customIcon = getCustomIcon(m.icon);
    const iconChar = customIcon || cat.icon;

    const item = document.createElement('div');
    item.className = `marker-item cat-${m.category}`;
    item.id = `mi-${m.id}`;
    item.innerHTML = `
      <div class="marker-item-title">
        <span>${iconChar}</span>
        <span>${escapeHtml(m.title)}</span>
        ${m.is_public === 0 ? '<span class="badge-private">私有</span>' : ''}
      </div>
      <div class="marker-item-meta">${cat.name} · ${escapeHtml(m.created_by)}</div>
      <div class="marker-item-coords">X: ${m.x}, Z: ${m.z}</div>`;
    item.addEventListener('click', () => {
      map.flyTo([m.z, m.x], Math.max(map.getZoom(), 0), {duration: .5});
      markersLayer.eachLayer(l => {
        const ll = l.getLatLng();
        if (Math.round(ll.lng) === m.x && Math.round(ll.lat) === m.z) l.openPopup();
      });
      document.querySelectorAll('.marker-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
    });
    list.appendChild(item);
  });

  if (!list.children.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px 10px;">暂无标注</div>';
  }
}

function filterMarkers(){ renderMarkers(); renderMarkerList(); }

function canEdit(m){
    if (!currentUser) return false;
    if (currentUser.role === 'admin' || currentUser.role === 'owner') return true;
    return currentUser.username === m.created_by;
}

function editMarker(id){ const m = markersData.find(x => x.id === id); if (m) openMarkerPanel(m); }

async function saveMarker(x, z){
  const title = document.getElementById('mTitle').value.trim();
  const category = document.getElementById('mCategory').value;
  const iconVal = document.getElementById('mIcon').value.trim();
  const desc = document.getElementById('mDesc').value.trim();
  const isPublic = document.getElementById('mPublic').checked;
  
  if (Array.from(iconVal).length > 3) {
    return showToast('自定义图标最多3个字符', 'error');
  }

  if (!title) return showToast('请输入标题', 'error');
  if (!currentUser) return showToast('请先登录', 'error');

  const payload = {x, z, title, category, description: desc, isPublic, icon: iconVal, world: currentWorld};
  
  console.log('保存标注 payload:', payload); // 调试用
  
  try {
    let r;
    if (selectedMarker) {
      r = await fetch(`/api/markers/${selectedMarker.id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}`},
        body: JSON.stringify(payload)
      });
    } else {
      r = await fetch('/api/markers', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}`},
        body: JSON.stringify(payload)
      });
    }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    console.log('保存成功，返回数据 icon:', d.icon); // 调试用
    showToast(selectedMarker ? '标注已更新' : '标注已添加', 'success');
    closePanels();
    await loadMarkers();
  } catch (e) { showToast(e.message, 'error'); }
}

async function deleteMarker(id){
  if (!confirm('确定要删除这个标注吗？此操作不可恢复。')) return;
  try {
    const r = await fetch(`/api/markers/${id}`, {
      method: 'DELETE',
      headers: {'Authorization': `Bearer ${currentUser.token}`}
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    showToast('标注已删除', 'success');
    closePanels();
    await loadMarkers();
  } catch (e) { showToast(e.message, 'error'); }
}

async function openUserPanel(){
    if (!currentUser) return;
    const p = document.getElementById('userPanel');
    p.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3>👥 用户管理</h3><button class="btn-icon" onclick="closePanels()">✕</button></div><div id="userList">加载中...</div>`;
    p.classList.remove('hidden');
    
    const r = await fetch('/api/users', { headers: { 'Authorization': `Bearer ${currentUser.token}` } });
    const users = await r.json();
    if (!r.ok) return showToast(users.error, 'error');

    const list = document.getElementById('userList');
    list.innerHTML = users.map(u => {
        const locked = (u.id === currentUser.id || u.role === 'owner');
        
        let actionButtons = '';
        if (!locked) {
            if (u.role === 'user') {
                actionButtons = `<button class="btn btn-sm" onclick="updateRole(${u.id}, 'admin')">设为管理员</button>`;
            } else if (u.role === 'admin') {
                actionButtons = `<button class="btn btn-sm btn-danger" onclick="updateRole(${u.id}, 'user')">撤销管理员</button>`;
            }
        } else if (u.role === 'owner') {
            actionButtons = `<span style="color:var(--accent);font-size:12px;">👑 所有者</span>`;
        }

        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid var(--border);">
            <span>${escapeHtml(u.username)} <small style="color:var(--text-muted)">(${u.role})</small></span>
            ${actionButtons}
        </div>`;
    }).join('');
}

async function updateRole(id, role) {
    const r = await fetch(`/api/users/${id}/role`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}`},
        body: JSON.stringify({ role })
    });
    const d = await r.json();
    if (!r.ok) return showToast(d.error, 'error');
    showToast('权限已更新', 'success');
    openUserPanel();
}

function openSettingsPanel(){
    const p = document.getElementById('settingsPanel');
    p.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3>⚙️ 账号设置</h3><button class="btn-icon" onclick="closePanels()">✕</button>
    </div>
    <div class="form-group"><label>旧密码</label><input type="password" id="oldPass" placeholder="必须输入旧密码"></div>
    <div class="form-group"><label>新用户名</label><input type="text" id="newUsername" value="${escapeHtml(currentUser.username)}"></div>
    <div class="form-group"><label>新密码</label><input type="password" id="newPass" placeholder="至少8位，且含大小写字母和数字"></div>
    <div class="form-actions">
        <button class="btn btn-sm" onclick="closePanels()">取消</button>
        <button class="btn btn-sm btn-primary" onclick="saveUserInfo()">保存修改</button>
    </div>`;
    p.classList.remove('hidden');
}

async function saveUserInfo(){
    const oldPass = document.getElementById('oldPass').value;
    const newUsername = document.getElementById('newUsername').value.trim();
    const newPass = document.getElementById('newPass').value;
    if (!oldPass || !newUsername || !newPass) return showToast('请填写完整', 'error');

    const r = await fetch('/api/auth/update', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${currentUser.token}`},
        body: JSON.stringify({ oldPassword: oldPass, newUsername, newPassword: newPass })
    });
    const d = await r.json();
    if (!r.ok) return showToast(d.error, 'error');
    
    localStorage.setItem('mcmap_token', d.token);
    currentUser = { token: d.token, username: d.username, role: currentUser.role };
    updateUserUI();
    closePanels();
    showToast('账号信息修改成功', 'success');
}

// 用服务器时间校准本地时钟（读响应头 X-Server-Time），消除前后端时钟偏差
function serverNow(){ return Date.now() + clockOffset; }
async function getServerTime(){
  try {
    const r = await fetch('/api/health');
    const t = r.headers.get('x-server-time');
    if (t) clockOffset = Number(t) - Date.now();
  } catch (e) { /* 忽略 */ }
}

function startApp(){
  if (window.__appStarted) return;
  window.__appStarted = true;
  initMap();
  initUI();
  getServerTime();
  // 移动端：默认收起侧栏（汉堡打开），避免遮挡地图
  if (window.innerWidth < 768) { const s = document.getElementById('sidebar'); if (s) s.classList.add('collapsed'); }
  checkAuth().then(() => Promise.all([loadTileIndex(), loadMarkers()]));
}
ensureStart();
